name: Update dependencies

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  prepare-darwin:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Assert native Darwin architecture
        run: test "$(uname -m)" = arm64

      - name: Update flake inputs
        run: just update-input

      - name: Refresh Darwin QMD dependencies
        run: just update-resource qmd

      - name: Create Darwin update patch
        run: git diff --binary -- nix-config/flake.lock nix-config/packages/qmd.nix > qmd-darwin.patch

      - name: Upload Darwin update patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qmd-darwin-patch
          path: qmd-darwin.patch

  update-and-open-pr:
    needs: prepare-darwin
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Darwin update patch
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qmd-darwin-patch

      - name: Apply Darwin update patch
        run: git apply qmd-darwin.patch

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Refresh managed resources
        run: just update-resource

      - name: Refresh Neovim resolver lock
        run: just update-neovim

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update dependency pull request
        id: dependency-pr
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/dependency-updates
          delete-branch: true
          commit-message: ":arrow_up: Update managed dependencies"
          title: ":arrow_up: Update managed dependencies"
          body: |
            Generated dependency update. Review and merge manually.
          assignees: ccamel
          reviewers: ccamel
