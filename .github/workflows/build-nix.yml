name: Build / Nix

on:
  push:
    branches: [main]
    paths:
      - "nix-config/**/*.nix"
      - "nix-config/assets/**/*.pem"
      - "nix-config/flake.lock"
      - "nix-config/secrets/**/*.yaml"
      - "nix-config/.sops.yaml"
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - "nix-config/**/*.nix"
      - "nix-config/assets/**/*.pem"
      - "nix-config/flake.lock"
      - "nix-config/secrets/**/*.yaml"
      - "nix-config/.sops.yaml"
      - .github/workflows/**

permissions:
  contents: read

jobs:
  build-nix:
    name: build-nix (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            name: forge
            timeout: 10
          - runner: macos-15
            name: tinymac
            timeout: 12
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      # Each native checks.<system> output is the host toplevel, so this also builds it.
      - name: Check ${{ matrix.name }} flake
        working-directory: nix-config
        run: nix flake check .
