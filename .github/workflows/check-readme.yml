name: Check / README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - justfile
      - scripts/generate-readme.py
      - scripts/tests/test_generate_readme.py
      - "nix-config/**/*.nix"
      - nix-config/flake.lock
      - .github/workflows/check-readme.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - justfile
      - scripts/generate-readme.py
      - scripts/tests/test_generate_readme.py
      - "nix-config/**/*.nix"
      - nix-config/flake.lock
      - .github/workflows/check-readme.yml

jobs:
  check-readme:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check generated README
        run: nix run --inputs-from ./nix-config nixpkgs#just -- check-readme
