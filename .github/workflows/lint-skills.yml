name: Lint / Agent Skills

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-skills.yml'
      - '.agents/skills/**'
      - 'justfile'
      - 'nix-config/flake.nix'
      - 'nix-config/flake.lock'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lint-skills.yml'
      - '.agents/skills/**'
      - 'justfile'
      - 'nix-config/flake.nix'
      - 'nix-config/flake.lock'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-skills:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Validate skills
        run: nix run --inputs-from ./nix-config nixpkgs#just -- check-skills
