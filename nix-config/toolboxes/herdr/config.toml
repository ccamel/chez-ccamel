onboarding = false

[experimental]
pane_history = false

[theme]
name = "vesper"
auto_switch = false

[theme.custom]
panel_bg = "reset"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[ui]
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"
