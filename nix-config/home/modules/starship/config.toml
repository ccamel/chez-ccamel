add_newline = true

format = """
$directory$git_branch$git_status$nix_shell
$character"""

# ====================== DIRECTORY ======================
[directory]
truncation_length = 0
format = "[$path]($style) "
style = "bold #FFAA00"

# ====================== GIT ======================
[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold #CC8800"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold #FF5555"

# ====================== NIX ======================
[nix_shell]
format = "via [❄️ $state( \\($name\\))]($style) "
style = "bold #00BBFF"

# ====================== CHARACTER (VI MODE) ======================
[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

vimcmd_symbol = "[N](bold yellow)"
vimcmd_replace_symbol = "[R](bold magenta)"
vimcmd_visual_symbol = "[V](bold cyan)"
